<form id="login-form" class="card form narrow" novalidate>
  <h1>Log in</h1>
  <div class="field">
    <label for="l-email">Email</label>
    <input id="l-email" type="email" autocomplete="email">
  </div>
  <div class="field">
    <label for="l-password">Password</label>
    <input id="l-password" type="password" autocomplete="current-password">
  </div>
  <button type="submit" class="btn btn-block">Log in</button>
  <p id="login-msg" class="msg error" role="alert"></p>
  <p class="muted">Demo account: <code>demo@lumen.test</code> / <code>Demo@1234</code></p>
  <p>New here? <a href="/register">Create an account</a></p>
</form>
