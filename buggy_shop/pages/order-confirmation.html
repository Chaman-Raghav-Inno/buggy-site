<div id="confirm" class="card confirm" hidden>
  <h1>Thank you for your order!</h1>
  <p>Your order number is <strong id="o-number"></strong>, placed on <span id="o-date"></span>.
    We've sent a confirmation to <span id="o-email"></span>.</p>
  <ul id="o-items" class="mini-items"></ul>
  <dl id="o-summary" class="totals"></dl>
  <p class="hero-actions">
    <a class="btn" href="/track">Track your order</a>
    <a class="btn btn-ghost" href="/shop">Continue shopping</a>
  </p>
</div>
<p id="confirm-missing" class="card" hidden>We couldn't find that order. <a href="/track">Track an order</a></p>
